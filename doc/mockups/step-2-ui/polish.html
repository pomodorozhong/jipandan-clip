.topbar-stages{flex:0 0 auto}
@container (max-width: 1000px){.topbar-stages{order:3;flex-basis:100%;display:flex;justify-content:center}.topbar-side{flex-basis:auto}}

.btn-primary{background:#b7d69d;color:#1b291f}.btn-primary:hover{background:#c8e5af}

.btn-icon{width:40px;padding:0}
.kbd{display:inline-flex;min-width:20px;height:22px;box-sizing:border-box;align-items:center;justify-content:center;border:1px solid currentColor;border-radius:5px;padding:0 5px;font-family:inherit;font-size:11px;font-weight:700;line-height:1;opacity:.75}

.seg{display:inline-flex;gap:2px;padding:3px;border:1px solid #34423b;border-radius:12px;background:#17211d}
.seg-btn{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 14px;border:0;border-radius:9px;background:transparent;color:#d6e0da;font:inherit;font-weight:600;cursor:pointer}
.seg-btn:hover{background:#283b30}
.seg-btn[aria-pressed="true"]{background:#b7d69d;color:#1b291f}
.seg-btn[aria-pressed="true"] .count{background:#1b291f;color:#d4ecbe}
.muted{color:#9eafa3}
.mono{font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.tag{display:inline-flex;align-items:center;border:1px solid;border-radius:6px;padding:2px 7px;font-size:11px;font-weight:650;line-height:1.2;white-space:nowrap}

.row{display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;padding:10px 18px;border:0;border-bottom:1px solid #29362f;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer}
.row:hover{background:#283b30}
.row[aria-current="true"]{background:#344b39;box-shadow:inset 3px 0 0 #cce7a9}
.score{min-width:30px;border-radius:6px;background:#1f2b26;padding:2px 6px;text-align:center;font-size:12px;color:#b7d69d;font-variant-numeric:tabular-nums}

.wave{display:flex;align-items:center;gap:2px;height:100%}
.wave-bar{flex:1;border-radius:2px}
.handle{position:absolute;top:-6px;bottom:-6px;width:3px;margin-left:-1px;background:#cce7a9;border-radius:2px}
.handle::after{content:"";position:absolute;top:-2px;left:-5px;width:13px;height:13px;border-radius:50%;background:#cce7a9}
