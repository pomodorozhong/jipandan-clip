[project]
name = "jipandan-clips"
version = "0.1.0"
description = "Jipandan-clips is a small tool to make clips from lengthy, raw audio files."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.117",
    "mlx-whisper>=0.4.3",
    "python-multipart>=0.0.32",
    "textual>=1.0.0",
    "textual-plot>=0.10.0",
    "uvicorn>=0.35",
]

[project.scripts]
transcribe = "jipandan.cli.transcribe:main"
generate-commands = "jipandan.cli.generate_commands:main"
jipandan = "jipandan.cli.main:main"
jipandan-serve = "jipandan.cli.serve:main"
jipandan-web = "jipandan.cli.web:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"jipandan.cli" = ["serve_templates/*.html"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.2.0",
    "pip>=26.0.1",
    "textual-dev>=1.8.0",
    "textual-serve-asgi[server]>=0.2.1",
]
